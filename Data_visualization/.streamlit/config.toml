# =========================
# Cấu hình server
# =========================
[server]
headless = true          # chạy mà không mở trình duyệt tự động
port = 8501              # port khi chạy app
enableCORS = false       # tắt CORS để dễ test local

# =========================
# Cấu hình giao diện (theme)
# =========================
[theme]
primaryColor = "#4CAF50"            # màu chính
backgroundColor = "#FFFFFF"         # nền chính
secondaryBackgroundColor = "#F0F2F6" # nền phụ
textColor = "#000000"               # màu chữ
font = "sans serif"                 # font chữ

# =========================
# Cấu hình layout
# =========================
[layout]
wide = true          # sử dụng layout rộng toàn màn hình

[server]
enableXsrfProtection = false